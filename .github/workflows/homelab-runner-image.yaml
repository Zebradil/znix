name: Homelab runner image

# Builds the image for the homelab ARC runner pods and, on main, publishes it as
# ghcr.io/zebradil/homelab-runner:{sha-<commit>,latest}. myks-homelab pins
# `latest` by digest and Renovate follows it. The image is reproducible, so a
# run that changes nothing in it re-pushes the same digest.

on:
  pull_request:
    paths:
      - flake.lock
      - modules/flake/homelab-runner.nix
      - .github/workflows/homelab-runner-image.yaml
  push:
    branches: [main]
    paths:
      - flake.lock
      - modules/flake/homelab-runner.nix
      - .github/workflows/homelab-runner-image.yaml
  # A manual "Build and Publish" run with a flake update commits flake.lock with
  # [skip ci], which the push trigger never sees.
  workflow_run:
    workflows: [Build and Publish]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled main run could leave `latest` pushed but unattested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  CACHE_PULL_URL: https://znix.zebradil.dev
  CACHE_PUBLIC_KEY: znix.zebradil.dev:nvr0OQFRddbHGopQbyLbLXQnntFBDKp23tqQq+msppw=
  IMAGE: ghcr.io/zebradil/homelab-runner

jobs:
  image:
    if: >-
      ${{ github.event_name != 'workflow_run'
          || (github.event.workflow_run.event == 'workflow_dispatch'
              && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: zebradil/nix-ci/.github/actions/setup-nix@4051cac72e577a0903ecbcee2ffedb4e9f6ac9f1 # v3.1.0
        with:
          extra-substituters: ${{ env.CACHE_PULL_URL }}
          extra-trusted-public-keys: ${{ env.CACHE_PUBLIC_KEY }}

      - name: Build image
        run: nix build .#packages.x86_64-linux.homelab-runner-image

      - name: Smoke image
        run: |
          set -euo pipefail
          image=$(docker load <result | sed -n 's/^Loaded image: //p')
          docker run --rm "$image" bash -c 'nix --version && Runner.Listener --version && id && ! command -v sudo'

      # Docker's credential store: actions/attest reads it to push the attestation, skopeo falls back to it.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        id: push
        run: |
          set -euo pipefail
          for tag in "sha-${GITHUB_SHA::12}" latest; do
            skopeo copy "docker-archive:result" "docker://$IMAGE:$tag"
          done
          echo "digest=$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:latest")" >>"$GITHUB_OUTPUT"

      - name: Attest image
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

name: Test Flake

# PR gate: evaluate the flake, then build every discovered check on a runner that matches its
# system and publish what was built.
# nix-ci's `build` action follows every push with the kasha generation manifest that keeps it
# alive through kasha's GC.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_PULL_URL: https://znix.zebradil.dev
  CACHE_PUBLIC_KEY: znix.zebradil.dev:nvr0OQFRddbHGopQbyLbLXQnntFBDKp23tqQq+msppw=
  # Forks cannot read secrets, so they build without pushing rather than failing at the push.
  PUSH_TO_CACHE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: zebradil/nix-ci/.github/actions/setup-nix@9c24e195d57be4639a5c85007c0c73eb805604cc # v2.0.1
        with:
          extra-substituters: ${{ env.CACHE_PULL_URL }}
          extra-trusted-public-keys: ${{ env.CACHE_PUBLIC_KEY }}

      - name: Pre-instantiate checks
        # A `*-build` check is a system toplevel whose closure pulls in source paths created during
        # evaluation (home.file sources scoped via builtins.path). `nix flake check --no-build`
        # evaluates a check's outPath but never instantiates it, so under lazy trees those paths are
        # known by hash yet never written to the store -> "path '...' is not valid". Forcing each
        # drvPath instantiates without building, which materializes them. One eval for all checks,
        # reusing a single flake evaluation instead of cold-loading it per attribute.
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          nix eval --json ".#checks.${system}" \
            --apply 'builtins.mapAttrs (_: c: c.drvPath)' >/dev/null

      - name: Check flake
        # --no-build: the build job builds every check on a runner that matches its system.
        run: nix flake check --no-build

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-targets: ${{ steps.discover.outputs.has-targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: zebradil/nix-ci/.github/actions/setup-nix@9c24e195d57be4639a5c85007c0c73eb805604cc # v2.0.1

      - name: Discover build targets
        id: discover
        uses: zebradil/nix-ci/.github/actions/discover@9c24e195d57be4639a5c85007c0c73eb805604cc # v2.0.1
        with:
          discovery-types: |
            checks
            devShells
          # aarch64-darwin is devShells-only: znix keeps no darwin host of its own, and a macOS
          # runner failure must not be able to block a lock update for the Linux hosts. The
          # company flake (trivago/zebradil-nix) builds its own darwin closures.
          attr-filter: '^devShells\.|^checks\.x86_64-linux\.|^checks\.aarch64-linux\..*-build$'
          runner-mapping: |
            x86_64-linux:ubuntu-latest
            aarch64-linux:ubuntu-24.04-arm
            aarch64-darwin:macos-26

  build:
    needs: [check, discover]
    if: ${{ needs.discover.outputs.has-targets == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: zebradil/nix-ci/.github/actions/setup-nix@9c24e195d57be4639a5c85007c0c73eb805604cc # v2.0.1
        with:
          extra-substituters: ${{ env.CACHE_PULL_URL }}
          extra-trusted-public-keys: ${{ env.CACHE_PUBLIC_KEY }}
          signing-key: ${{ env.PUSH_TO_CACHE == 'true' && secrets.CACHE_SIGNING_KEY || '' }}

      - name: Build attr
        uses: zebradil/nix-ci/.github/actions/build@9c24e195d57be4639a5c85007c0c73eb805604cc # v2.0.1
        with:
          attr: ${{ matrix.attr }}
          strategy: uncached-leaves
          cache-s3-url: ${{ env.PUSH_TO_CACHE == 'true' && vars.CACHE_S3_URL || '' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  required-checks:
    name: required-checks
    needs: [check, discover, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI result
        # build is 'skipped' when discovery found nothing to build — still a pass.
        env:
          RESULTS: ${{ needs.check.result }} ${{ needs.discover.result }} ${{ needs.build.result }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [[ "$r" == "success" || "$r" == "skipped" ]] || exit 1
          done

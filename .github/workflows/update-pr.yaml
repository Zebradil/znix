name: Update Flake Lock (PR)

# Nightly `nix flake update` opened as a PR, with an dix package diff of what the update really
# changes and the post-update builds published to the binary cache.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_APP_TOKEN: ${{ secrets.CI_APP_ID != '' && secrets.CI_APP_PRIVATE_KEY != '' }}
      CACHE_S3_URL: ${{ vars.CACHE_S3_URL }}
    steps:
      # Before checkout, so actions/checkout can bake the push credentials into the git remote.
      - name: Generate app token
        id: app-token
        if: ${{ env.HAS_APP_TOKEN == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Nix
        uses: zebradil/nix-ci/.github/actions/setup-nix@fa4ea864c879251657017bb0e4aed9009c0d8b2b # v2.0.2
        with:
          extra-substituters: https://znix.zebradil.dev
          extra-trusted-public-keys: znix.zebradil.dev:nvr0OQFRddbHGopQbyLbLXQnntFBDKp23tqQq+msppw=
          signing-key: ${{ secrets.CACHE_SIGNING_KEY }}

      - name: Update flake.lock and open PR
        uses: zebradil/nix-ci/.github/actions/update-lock-pr@fa4ea864c879251657017bb0e4aed9009c0d8b2b # v2.0.2
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          has-app-token: ${{ steps.app-token.outputs.token != '' }}
          branch-name: automation/flake-update
          auto-merge: true
          diff-targets: |
            checks.x86_64-linux.tuxedo-build
            checks.aarch64-linux.toddler-build
          cache-s3-url: ${{ env.CACHE_S3_URL }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

name: Workarounds

# Scheduled check on whether each entry in modules/flake/workarounds/ is still
# needed, judged against the inputs the flake would move to next. A probe that
# BUILDS is the alarm: upstream is fixed, and the entry gets a removal PR that
# also carries the updated lock. See docs/workarounds.md.
#
# Standalone: its pass condition is inverted relative to every other workflow
# here, and it must never block the nightly lock update.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-targets: ${{ steps.matrix.outputs.has_targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: zebradil/nix-ci/.github/actions/setup-nix@fa4ea864c879251657017bb0e4aed9009c0d8b2b # v2.0.2

      - name: Update inputs
        run: nix flake update

      - name: Upload candidate lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-lock
          path: flake.lock
          retention-days: 7

      - name: Build probe matrix
        id: matrix
        env:
          RUNNER_MAPPING: |
            x86_64-linux:ubuntu-latest
            aarch64-linux:ubuntu-24.04-arm
            aarch64-darwin:macos-26
        run: nix run .#workarounds -- matrix

  probe:
    needs: candidate
    if: ${{ needs.candidate.outputs.has-targets == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.candidate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CACHE_S3_URL: ${{ vars.CACHE_S3_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download candidate lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-lock

      - name: Setup Nix
        uses: zebradil/nix-ci/.github/actions/setup-nix@fa4ea864c879251657017bb0e4aed9009c0d8b2b # v2.0.2
        with:
          extra-substituters: https://znix.zebradil.dev
          extra-trusted-public-keys: znix.zebradil.dev:nvr0OQFRddbHGopQbyLbLXQnntFBDKp23tqQq+msppw=
          signing-key: ${{ secrets.CACHE_SIGNING_KEY }}

      - name: Probe
        env:
          NAME: ${{ matrix.name }}
          SYSTEM: ${{ matrix.system }}
        run: nix run .#workarounds -- probe "$NAME" "$SYSTEM" "$RUNNER_TEMP/verdicts"

      - name: Upload verdict
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict-${{ matrix.name }}-${{ matrix.system }}
          path: ${{ runner.temp }}/verdicts/${{ matrix.name }}__${{ matrix.system }}.json
          retention-days: 7

      # A successful probe builds what every host pulls once the entry is gone,
      # so warm the cache with it. setup-nix already signs via secret-key-files.
      - name: Push to cache
        if: ${{ env.CACHE_S3_URL != '' }}
        env:
          VERDICT: ${{ runner.temp }}/verdicts/${{ matrix.name }}__${{ matrix.system }}.json
          S3_URL: ${{ env.CACHE_S3_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # `compression` is a store setting, so it only travels as a URL query parameter.
          case "$S3_URL" in
            *compression=*) ;;
            *\?*) S3_URL="$S3_URL&compression=zstd&compression-level=6" ;;
            *) S3_URL="$S3_URL?compression=zstd&compression-level=6" ;;
          esac
          jq -r '.paths[]' "$VERDICT" | xargs -r nix copy --to "$S3_URL"

  propose:
    needs: [candidate, probe]
    if: ${{ always() && needs.candidate.outputs.has-targets == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_APP_TOKEN: ${{ secrets.CI_APP_ID != '' && secrets.CI_APP_PRIVATE_KEY != '' }}
    steps:
      # Before checkout, so actions/checkout can configure the push credentials.
      - name: Generate app token
        id: app_token
        if: ${{ env.HAS_APP_TOKEN == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app_token.outputs.token || github.token }}

      - name: Download candidate lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-lock

      - name: Download verdicts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verdict-*
          merge-multiple: true
          path: ${{ runner.temp }}/verdicts

      - name: Setup Nix
        uses: zebradil/nix-ci/.github/actions/setup-nix@fa4ea864c879251657017bb0e4aed9009c0d8b2b # v2.0.2
        with:
          extra-substituters: https://znix.zebradil.dev
          extra-trusted-public-keys: znix.zebradil.dev:nvr0OQFRddbHGopQbyLbLXQnntFBDKp23tqQq+msppw=

      - name: Open or close removal PRs
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
        run: nix run .#workarounds -- propose "$RUNNER_TEMP/verdicts"
